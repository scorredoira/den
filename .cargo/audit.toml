# `cargo audit --deny warnings` (CI's checks) fails on any advisory: a
# vulnerability, a yanked crate or an unmaintained one. Except these:
# unmaintained, with no known vulnerability, and reached only through GPUI,
# so they go when GPUI drops them.
[advisories]
ignore = [
    "RUSTSEC-2024-0384", # instant: gpui-base
    "RUSTSEC-2024-0436", # paste: gpui-component
    "RUSTSEC-2025-0134", # rustls-pemfile: gpui-kit-assets' reqwest
    "RUSTSEC-2026-0206", # rustybuzz: gpui-pre's usvg
    "RUSTSEC-2026-0192", # ttf-parser: gpui-pre's fonts
]
