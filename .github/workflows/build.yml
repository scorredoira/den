name: Build packages
on:
  workflow_call:
    inputs:
      package:
        description: Build the release packages too, not only test
        type: boolean
        default: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # As in rust-toolchain.toml.
  RUST_TOOLCHAIN: '1.99.0'
jobs:
  checks:
    name: Checks
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2
      - name: Audit dependencies
        # The advisories allowed are in .cargo/audit.toml.
        run: cargo audit --deny warnings
      - name: Test release command
        run: python3 -m unittest discover -s packaging/tests -v
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: checks
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang cmake pkg-config libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
  test:
    name: Test ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            rustflags: ''
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ''
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: ''
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: test-${{ matrix.target }}
          # Branches start from master's cache without replacing it.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang cmake pkg-config libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - name: Chrome for the debugger's tests
        # The runner's Chrome, which crates/chrome finds by itself on macOS
        # and Linux.
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'DEN_CHROME=C:\Program Files\Google\Chrome\Application\chrome.exe' >> "$GITHUB_ENV"
      - name: Compile tests
        run: cargo test --locked --workspace --no-run --target ${{ matrix.target }}
      - name: Test
        timeout-minutes: 5
        run: cargo test --locked --workspace --target ${{ matrix.target }} -- --nocapture
  linux-agent:
    name: Linux SSH agent
    if: inputs.package
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: linux-agent
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p agent --target x86_64-unknown-linux-musl
      - name: Prepare agent
        run: |
          mkdir -p ssh-agent
          cp target/x86_64-unknown-linux-musl/release/den-agent ssh-agent/den-agent-linux-x86_64
          file ssh-agent/den-agent-linux-x86_64
          ./ssh-agent/den-agent-linux-x86_64 --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-agent
          path: ssh-agent/den-agent-linux-x86_64
          if-no-files-found: error
  desktop:
    name: Package ${{ matrix.name }}
    if: inputs.package
    timeout-minutes: 60
    needs: linux-agent
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            rustflags: ''
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ''
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: ''
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: package-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang cmake pkg-config libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ssh-agent
          path: ssh-agent
      - name: Build
        run: cargo build --release --locked -p ui -p agent --target ${{ matrix.target }}
      - name: Package
        run: python packaging/package.py --target ${{ matrix.target }} --agent ssh-agent/den-agent-linux-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
