name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Skipped for ./release's commit, which the Release workflow of its tag
    # tests and packages, and for a pull request from a branch of this
    # repository, which its push already tests.
    if: >-
      !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')) &&
      !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/build.yml
    with:
      # Every branch is tested; master and manual runs are packaged too.
      package: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
