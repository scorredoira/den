name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        name: Validate version and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag must match Cargo.toml: $tag" >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)" || { echo 'Version already tags a different commit'; exit 1; }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump the version before publishing again." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/build.yml
  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      # The app installs an update only if its SHA256SUMS is signed with this
      # key for that release (`verify_signature` in crates/ui/src/update.rs).
      - name: Sign the checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [[ -z "$MINISIGN_SECRET_KEY" ]]; then
            echo "The MINISIGN_SECRET_KEY secret is not set: installed apps would refuse this release." >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m dist/SHA256SUMS -t "den $RELEASE_TAG SHA256SUMS"
          minisign -V -p packaging/minisign.pub -m dist/SHA256SUMS
      - name: Publish all packages together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          latest=false
          if [[ "$PRERELEASE" == true || "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          else
            # GitHub marks as Latest whichever release finishes last. When two
            # releases overlap, only the highest version may take it.
            highest=$({ gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName -q '.[].tagName'; echo "$RELEASE_TAG"; } | sort -V | tail -1)
            if [[ "$highest" == "$RELEASE_TAG" ]]; then latest=true; fi
          fi
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "Den $RELEASE_TAG" --generate-notes --notes-file packaging/release-notes.txt --draft --latest=false "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
