[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "2.30.37"

[workspace.dependencies]
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-go", "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-markdown", "tree-sitter-sql", "tree-sitter-css", "tree-sitter-html", "tree-sitter-bash", "tree-sitter-diff", "tree-sitter-python", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-make"] }
anyhow = "1"
alacritty_terminal = "0.26"
dirs = "6"
libc = "0.2"
portable-pty = "0.9"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proto = { path = "crates/proto" }
client = { path = "crates/client" }
ui-term = { path = "crates/ui-term" }
join = { path = "crates/join" }
chrome = { path = "crates/chrome" }
ignore = "0.4"
notify = "7"
smol = "2"
trash = "5"
serde_bytes = "0.11"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# Line numbers in our own crates' backtraces. "unpacked" leaves the debug
# info in the object files instead of copying it into each binary: the
# fastest link on macOS (no dsymutil) and Linux (.dwo files), at the cost
# of keeping those files in target/ (docs/releasing.md says how to prune).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies optimized, and without debug info: nothing of theirs is
# stepped through, and their object files were most of target/.
[profile.dev.package."*"]
opt-level = 2
debug = 0

# crash.rs symbolizes its backtrace in the process, from the symbol table:
# only the debug info may be stripped, never the symbols.
[profile.release]
lto = "thin"
strip = "debuginfo"

# gpui-base with a few public additions for the editor (selections and
# batch edits), gpui-component with the completion menu drawn like VS
# Code's, and gpui-pre-macos with function keys sent as U+0010; see
# vendor/README.md.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
