[package]
name = "ui"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "den"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
# Only for the editor actions gpui-component doesn't re-export.
gpui-base = "=0.7.0"
ui-term.workspace = true
client.workspace = true
proto.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
smol.workspace = true
nucleo-matcher = "0.3"
regex = "1"
lsp-types = "0.97"
tree-sitter-xml = "0.7"
tree-sitter = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
# Already GPUI's: the Device panel opens a program's frames as its pixel buffers.
core-video = "0.5"
core-foundation = "0.10"
# Already GPUI's: Cmd-E asks AppKit whether its key is held down.
objc2 = "0.6"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
